name: Build Play bundle (MelodiaApp)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode upload keystore
        id: keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No UPLOAD_KEYSTORE_BASE64 secret: building an unsigned bundle (not uploadable to Play)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Every Play upload needs a higher versionCode than the last one, so it
      # comes from the run number instead of a manual bump.
      - name: Build Play release bundle
        run: |
          chmod +x gradlew
          export MELODIA_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          ./gradlew --console=plain :app:bundlePlayRelease --warning-mode summary
        env:
          MELODIA_UPLOAD_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MELODIA_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          MELODIA_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          MELODIA_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: MelodiaApp-play-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'unsigned' }}-${{ github.run_number }}
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: MelodiaApp-play-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: warn

      # Only main publishes; PR builds stop at the artifact.
      - name: Upload to Play internal testing
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.keystore.outputs.signed == 'true' &&
          env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.sangregoriopaolo.melodiaapp
          releaseFiles: app/build/outputs/bundle/playRelease/*.aab
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
          track: internal
          status: completed
